# Copy to .github/workflows/pr-demon.yml in your project. It must be on the
# default branch: GitHub only runs issue/comment workflows from there.
name: pr-demon

on:
  issues: { types: [labeled, closed] }           # label → build · close → clean up
  issue_comment: { types: [created] }            # "/demon …" on a PR → revise
  pull_request_target: { types: [closed] }       # merged or closed → clean up (runs main's copy of this file)
  schedule: [{ cron: "17 4 * * *" }]             # nightly: clean up leftovers
  workflow_dispatch:                             # run any command by hand
    inputs:
      command: { type: choice, options: [build, review, revise, teardown, reap], default: reap }
      number: { description: "issue or PR number", default: "" }

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: pr-demon-${{ github.event.issue.number || github.event.pull_request.number || inputs.number || 'reap' }}
  cancel-in-progress: false

jobs:
  demon:
    # Filter here so unrelated events never wait for (or wake) the runner.
    if: >-
      (github.event_name == 'issues' && (github.event.action == 'closed' || github.event.label.name == 'pr-demon')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/demon') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      github.event_name == 'pull_request_target' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [pr-demon]
    timeout-minutes: 240
    steps:
      - uses: metapages/pr-demon@main   # pin to a commit SHA once you depend on it
        with:
          github-token: ${{ github.token }}
          claude-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
