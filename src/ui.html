<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pr-demon</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #fff; --ink: #1d1d1b; --ink-2: #55534e; --ink-3: #8a877f; --line: #e4e1da;
    --accent: #5b3fd1; --ok: #1f8a4c; --warn: #b26b00; --bad: #c0392b; --info: #2b6cb0; --chip: #efede8;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --panel: #1e1e1c; --ink: #ecebe7; --ink-2: #b6b3ab; --ink-3: #7d7a73; --line: #33322f;
      --accent: #9d86ff; --ok: #4cc27f; --warn: #e3a33a; --bad: #ef6b5b; --info: #6aa8ef; --chip: #2a2a27; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .2px; }
  nav { display: flex; gap: 4px; margin-left: 8px; }
  nav a { padding: 4px 10px; border-radius: 6px; color: var(--ink-2); }
  nav a.on { background: var(--chip); color: var(--ink); }
  .grow { flex: 1; }
  .muted { color: var(--ink-3); } .small { font-size: 12px; }
  button { font: inherit; font-size: 13px; padding: 5px 11px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
  button:hover { border-color: var(--ink-3); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--bad); }
  button.confirm { background: var(--bad); border-color: var(--bad); color: #fff; }
  main { max-width: 1180px; margin: 0 auto; padding: 18px 20px 60px; display: grid; gap: 18px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  section > h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--ink-2); margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
  .pad { padding: 14px 16px; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; font-weight: 500; color: var(--ink-3); }
  tr:last-child td { border-bottom: 0; }
  tr.job { cursor: pointer; } tr.job:hover td { background: color-mix(in srgb, var(--chip) 60%, transparent); }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: var(--chip); color: var(--ink-2); white-space: nowrap; }
  .s-running { background: color-mix(in srgb, var(--info) 18%, transparent); color: var(--info); }
  .s-queued { color: var(--ink-2); }
  .s-paused { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .s-done { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
  .s-failed { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
  .s-cancelled, .s-ignored { color: var(--ink-3); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); margin-right: 6px; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
  .actions { white-space: nowrap; text-align: right; } .actions button { margin-left: 4px; padding: 3px 9px; }
  .reason { color: var(--ink-2); font-size: 12px; max-width: 420px; }
  pre.activity { margin: 0; padding: 10px 14px; background: var(--bg); font: 12px/1.5 var(--mono); color: var(--ink-2); max-height: 280px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
  .meter { height: 10px; border-radius: 99px; background: var(--chip); overflow: hidden; margin: 8px 0; }
  .meter > div { height: 100%; background: var(--accent); transition: width .4s; }
  .meter.full > div { background: var(--bad); }
  .budget { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; align-items: baseline; }
  .big { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .events { font: 12px/1.6 var(--mono); max-height: 320px; overflow: auto; }
  .events div { padding: 2px 16px; border-bottom: 1px dashed var(--line); }
  .e-warn { color: var(--warn); } .e-error { color: var(--bad); }
  textarea { width: 100%; min-height: 62vh; border: 0; padding: 14px 16px; background: var(--panel); color: var(--ink); font: 13px/1.55 var(--mono); resize: vertical; outline: none; }
  .bar { display: flex; gap: 8px; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .msg-ok { color: var(--ok); } .msg-bad { color: var(--bad); white-space: pre-wrap; }
  .empty { padding: 18px 16px; color: var(--ink-3); }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 860px) { .cols { grid-template-columns: 1fr; } .hide-sm { display: none; } }
</style>
</head>
<body>
<header>
  <h1>😈 pr-demon</h1>
  <nav><a href="#" id="tab-status">Status</a><a href="#config" id="tab-config">Config</a></nav>
  <span class="grow"></span>
  <span id="proxy" class="badge" hidden></span>
  <span id="pill" class="badge">…</span>
  <span id="poll" class="muted small"></span>
  <button id="poll-now" title="Check GitHub for new labels and comments now">Check GitHub now</button>
  <button id="pause"></button>
</header>

<main id="view-status">
  <div class="cols">
    <section>
      <h2>Token budget</h2>
      <div class="pad" id="budget"></div>
    </section>
    <section>
      <h2>How to use</h2>
      <div class="pad small" id="howto"></div>
    </section>
  </div>
  <section>
    <h2>Work <span class="muted small" style="text-transform:none;letter-spacing:0">click a row for live agent activity</span></h2>
    <div id="jobs" class="scroll"></div>
  </section>
  <section>
    <h2>Preview stacks</h2>
    <div id="stacks" class="scroll"></div>
  </section>
  <section>
    <h2>Events</h2>
    <div id="events" class="events"></div>
  </section>
</main>

<main id="view-config" hidden>
  <section>
    <h2>Config <span class="muted small" id="cfg-path" style="text-transform:none;letter-spacing:0"></span></h2>
    <textarea id="cfg" spellcheck="false" wrap="off"></textarea>
    <div class="bar">
      <button class="primary" id="cfg-save">Save</button>
      <button id="cfg-revert">Revert</button>
      <span id="cfg-msg" class="small"></span>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ago = (t) => { if (!t) return "—"; const s = Math.round((Date.now() - t) / 1000);
  return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.round(s / 60)}m ago` : s < 172800 ? `${Math.round(s / 3600)}h ago` : `${Math.round(s / 86400)}d ago`; };
const dur = (ms) => { const s = Math.max(0, Math.round(ms / 1000));
  return s < 60 ? `${s}s` : s < 3600 ? `${Math.round(s / 60)}m` : `${Math.floor(s / 3600)}h${Math.round((s % 3600) / 60)}m`; };
const until = (t) => dur(t - Date.now());
const amt = (n) => n >= 1e9 ? `${(n / 1e9).toFixed(2)}B` : n >= 1e6 ? `${(n / 1e6).toFixed(2)}M` : n >= 1e3 ? `${(n / 1e3).toFixed(1)}k` : String(n);
const api = (path, method = "GET", body) => fetch(path, { method, headers: { "content-type": "application/json", "x-pr-demon": "1" }, body: body && JSON.stringify(body) })
  .then(async (r) => { const j = await r.json(); if (!r.ok) throw new Error(j.error || r.statusText); return j; });

let S = null;
const open = new Set();          // expanded job rows
const armed = new Map();         // confirm-twice buttons: key → timeout

function link(repo, n, pr) { return `<a href="https://github.com/${esc(repo)}/${pr ? "pull" : "issues"}/${n}" target="_blank" rel="noopener">${esc(repo.split("/")[1])}#${n}</a>`; }

function render() {
  if (!S) return;
  $("pill").textContent = S.paused ? "paused" : `running · ${S.jobs.filter((j) => j.state === "running").length}/${S.concurrency} agents`;
  $("pill").className = `badge ${S.paused ? "s-paused" : "s-running"}`;
  $("pause").textContent = S.paused ? "Resume" : "Pause";
  $("pause").className = S.paused ? "primary" : "";
  $("poll").innerHTML = S.poll.error ? `<span class="e-error">GitHub: ${esc(S.poll.error)}</span>`
    : `checked ${ago(S.poll.lastAt)} · next in ${until(S.poll.nextAt)}`;

  const px = S.proxy;
  $("proxy").hidden = !px.enabled && !px.error;
  if (px.enabled || px.error) {
    $("proxy").textContent = px.running ? `*.${px.domain} · ${px.mode} · ${px.routes} route${px.routes === 1 ? "" : "s"}` : `*.${px.domain} · proxy down`;
    $("proxy").className = `badge ${px.running ? "s-done" : "s-failed"}`;
    $("proxy").title = px.error || "Public preview proxy (Caddy) managed by pr-demon";
  }

  const b = S.budget, pct = b.limit ? Math.min(100, (b.used / b.limit) * 100) : 0;
  $("budget").innerHTML = `
    <div class="budget"><span class="big">${esc(b.usedText)}</span><span class="muted">of ${esc(b.limitText)} · last ${esc(b.window)}</span></div>
    ${b.limit ? `<div class="meter ${pct >= 100 ? "full" : ""}"><div style="width:${pct}%"></div></div>` : `<div class="muted small" style="margin:8px 0">No window limit set. Add <code>tokens = "40M"</code> under [budget] in Config.</div>`}
    <div class="small muted">new tokens ${amt(b.breakdown.input + b.breakdown.output + b.breakdown.cache_create)} · cache reads ${amt(b.breakdown.cache_read)} ${b.countCacheReads ? "(counted)" : "(not counted)"}</div>
    <div class="small muted">per-issue cap: ${b.perIssue ? esc(b.perIssue) : "none"}${b.freesAt ? ` · budget frees up in ${until(b.freesAt)}` : ""}</div>`;

  $("howto").innerHTML = S.repos.length
    ? `Add the <span class="badge">${esc(S.label)}</span> label to an issue in ${S.repos.map((r) => `<a href="https://github.com/${esc(r)}/issues" target="_blank">${esc(r)}</a>`).join(", ")}.
       Ask for changes with a PR comment starting <code>/demon</code>. Merge or close the PR to clean up.`
    : `<b>No repos configured yet.</b> Open <a href="#config">Config</a> and add a <code>[[repos]]</code> block.`;

  const jobs = S.jobs;
  $("jobs").innerHTML = jobs.length ? `<table><thead><tr><th>State</th><th>Job</th><th>Issue / PR</th><th class="hide-sm">Branch</th><th>Tokens</th><th class="hide-sm">When</th><th></th></tr></thead><tbody>${
    jobs.map((j) => {
      const isPr = j.kind === "review" || j.kind === "revise";
      const when = j.state === "running" ? `for ${dur(Date.now() - j.started_at)}` : j.finished_at ? ago(j.finished_at) : ago(j.created_at);
      const btns = [
        ["running", "queued", "paused"].includes(j.state) && btn(`cancel-${j.id}`, "Cancel", "danger"),
        ["paused", "failed", "cancelled"].includes(j.state) && btn(`resume-${j.id}`, "Resume", "", "Continue where it left off"),
        ["paused", "failed", "cancelled", "done"].includes(j.state) && j.kind !== "teardown" && btn(`retry-${j.id}`, "Retry", "", "Start over with a fresh agent"),
      ].filter(Boolean).join("");
      const row = `<tr class="job" data-job="${j.id}" id="job-${j.id}">
        <td><span class="badge s-${j.state}">${j.state}</span></td>
        <td>${esc(j.kind)}</td>
        <td>${link(j.repo, j.number, isPr)}${j.pr && j.kind === "build" ? ` → ${link(j.repo, j.pr, true)}` : ""}
          ${j.reason ? `<div class="reason">${esc(j.reason)}${j.resume_after ? ` · resumes in ${until(j.resume_after)}` : ""}</div>` : ""}</td>
        <td class="hide-sm small">${esc(j.branch)}</td>
        <td class="small">${j.tokens ? esc(j.tokensText) : "—"}${j.cost ? `<div class="muted">≈$${j.cost.toFixed(2)} list</div>` : ""}</td>
        <td class="hide-sm small muted">${when}</td>
        <td class="actions">${btns}</td></tr>`;
      const detail = open.has(j.id) ? `<tr><td colspan="7" style="padding:0"><pre class="activity">${
        j.activity.length ? esc(j.activity.join("\n")) : j.state === "running" ? "waiting for the agent's first tool call…" : "No live activity (only kept while pr-demon runs). Full logs: ~/.pr-demon/out/…"}</pre></td></tr>` : "";
      return row + detail;
    }).join("")}</tbody></table>` : `<div class="empty">Nothing yet. Label an issue <span class="badge">${esc(S.label)}</span> to start.</div>`;

  $("stacks").innerHTML = S.stacks.length ? `<table><thead><tr><th>Branch</th><th>Issue / PR</th><th>Preview</th><th class="hide-sm">Checked</th><th></th></tr></thead><tbody>${
    S.stacks.map((s) => `<tr>
      <td class="small">${esc(s.branch)}</td>
      <td>${link(s.repo, s.issue)}${s.pr ? ` → ${link(s.repo, s.pr, true)}` : ""}</td>
      <td><span class="dot ${s.healthy === 1 ? "ok" : s.healthy === 0 ? "bad" : ""}"></span>${
        s.public_url ? `<a href="${esc(s.public_url)}" target="_blank" rel="noopener">${esc(s.public_url)}</a>` : ""}${
        s.url ? `<div class="${s.public_url ? "small muted" : ""}">${s.public_url ? "local: " : ""}<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url)}</a></div>` : `<span class="muted">no URL</span>`}</td>
      <td class="hide-sm small muted">${ago(s.checked_at)}</td>
      <td class="actions">${btn(`restart|${s.repo}|${s.branch}`, "Restart")}${btn(`teardown|${s.repo}|${s.branch}`, "Tear down", "danger")}</td></tr>`).join("")}</tbody></table>`
    : `<div class="empty">No preview stacks running.</div>`;

  $("events").innerHTML = S.events.map((e) => `<div class="e-${e.level}"><span class="muted">${new Date(e.at).toLocaleTimeString()}</span> ${e.job_id ? `<a href="#job-${e.job_id}">job ${e.job_id}</a> ` : ""}${esc(e.message)}</div>`).join("");
}

function btn(key, label, cls = "", title = "") {
  const isArmed = armed.has(key);
  return `<button data-act="${esc(key)}" class="${isArmed ? "confirm" : cls}" title="${esc(title)}">${isArmed ? "Sure?" : label}</button>`;
}

async function refresh() {
  try { S = await api("/api/status"); render(); }
  catch (e) { $("pill").textContent = "pr-demon is not running"; $("pill").className = "badge s-failed"; }
}

document.addEventListener("click", async (ev) => {
  const b = ev.target.closest("button[data-act]");
  if (b) {
    ev.stopPropagation();
    const key = b.dataset.act;
    const destructive = key.startsWith("cancel-") || key.startsWith("teardown|") || key.startsWith("retry-");
    if (destructive && !armed.has(key)) {            // confirm by clicking twice, no browser dialogs
      armed.set(key, setTimeout(() => { armed.delete(key); render(); }, 3000)); render(); return;
    }
    clearTimeout(armed.get(key)); armed.delete(key);
    if (key.includes("|")) { const [act, repo, branch] = key.split("|"); await api(`/api/stacks/${act}`, "POST", { repo, branch }); }
    else { const [act, id] = key.split("-"); await api(`/api/jobs/${id}/${act}`, "POST"); }
    return refresh();
  }
  const row = ev.target.closest("tr[data-job]");
  if (row && !ev.target.closest("a")) { const id = Number(row.dataset.job); open.has(id) ? open.delete(id) : open.add(id); render(); }
});

$("pause").onclick = async () => { await api("/api/pause", "POST", { paused: !S?.paused }); refresh(); };
$("poll-now").onclick = async () => { await api("/api/poll", "POST"); setTimeout(refresh, 1500); };

// ---------- config tab: loaded on open, never overwritten by the refresh loop ----------
let loadedCfg = "";
async function loadConfig() {
  const { text } = await api("/api/config");
  loadedCfg = text; $("cfg").value = text; $("cfg-msg").textContent = ""; $("cfg-path").textContent = S?.configPath ?? "";
}
$("cfg-save").onclick = async () => {
  $("cfg-msg").className = "small"; $("cfg-msg").textContent = "Saving…";
  try { await api("/api/config", "PUT", { text: $("cfg").value }); loadedCfg = $("cfg").value;
    $("cfg-msg").className = "small msg-ok"; $("cfg-msg").textContent = "Saved. Changes apply now (a new port applies after a restart)."; refresh(); }
  catch (e) { $("cfg-msg").className = "small msg-bad"; $("cfg-msg").textContent = `Not saved: ${e.message}`; }
};
$("cfg-revert").onclick = () => { $("cfg").value = loadedCfg; $("cfg-msg").textContent = ""; };
$("cfg").addEventListener("keydown", (e) => { if ((e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); $("cfg-save").click(); } });

function route() {
  const cfg = location.hash === "#config";
  $("view-status").hidden = cfg; $("view-config").hidden = !cfg;
  $("tab-status").className = cfg ? "" : "on"; $("tab-config").className = cfg ? "on" : "";
  if (cfg) loadConfig();
  const m = /^#job-(\d+)$/.exec(location.hash); if (m) open.add(Number(m[1]));
}
window.addEventListener("hashchange", route);
route(); refresh(); setInterval(refresh, 3000);
</script>
</body>
</html>
